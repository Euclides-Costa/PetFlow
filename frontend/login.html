<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetFlow - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a2b1e 0%, #0d3d28 50%, #0a2b1e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
        }

        .login-card {
            background: linear-gradient(145deg, #0f3528, #0b2c20);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(46,204,113,0.3);
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 3rem;
            background: #2ecc71;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(46,204,113,0.5);
            margin-bottom: 1rem;
        }

        .logo h1 {
            font-size: 1.8rem;
            color: #fff;
        }

        .logo p {
            color: #a0c4b0;
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(46,204,113,0.3);
            border-radius: 12px;
            color: #e0e7e0;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 10px rgba(46,204,113,0.2);
        }

        .btn-login {
            width: 100%;
            background: #2ecc71;
            border: none;
            padding: 12px;
            border-radius: 12px;
            color: #0a2b1e;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }

        .btn-login:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }

        .btn-clear {
            width: 100%;
            background: rgba(231,76,60,0.2);
            border: 1px solid #e74c3c;
            padding: 10px;
            border-radius: 12px;
            color: #e74c3c;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            background: #e74c3c;
            color: white;
        }

        .register-link {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.85rem;
        }

        .register-link a {
            color: #2ecc71;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(231,76,60,0.2);
            border: 1px solid #e74c3c;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 1rem;
            color: #e74c3c;
            font-size: 0.85rem;
            display: none;
        }

        .success-message {
            background: rgba(46,204,113,0.2);
            border: 1px solid #2ecc71;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 1rem;
            color: #2ecc71;
            font-size: 0.85rem;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-bottom: 1rem;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(46,204,113,0.3);
            border-top-color: #2ecc71;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-box {
            background: rgba(46,204,113,0.1);
            border: 1px solid rgba(46,204,113,0.3);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 1rem;
            font-size: 0.75rem;
            text-align: center;
            color: #a0c4b0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">🐾</div>
            <h1>PetFlow</h1>
            <p>Monitoramento inteligente de alimentação</p>
        </div>

        <div id="infoBox" class="info-box" style="display: none;"></div>
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>🔒 Senha</label>
                <input type="password" id="senha" required placeholder="••••••">
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <!--        <button id="btnClear" class="btn-clear">🗑️ Limpar Sessão</button>-->

        <div class="register-link">
            Não tem uma conta? <a href="/cadastro">Cadastre-se</a>
        </div>
    </div>
</div>

<script>
    const API_URL = window.location.origin;
    //const API_URL = "172.20.10.2:3000";


    // Mostrar se já está logado (apenas informativo, sem redirecionar)
    const token = localStorage.getItem('token');
    const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');

    if (token && usuario.nome) {
        const infoBox = document.getElementById('infoBox');
        infoBox.style.display = 'block';
        infoBox.innerHTML = `🔐 Você está logado como <strong>${usuario.nome}</strong>. <a href="/dashboard" style="color:#2ecc71;">Clique aqui</a> para ir ao Dashboard ou faça logout abaixo.`;
    }

    // Botão para limpar sessão


    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('successMessage').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        try {
            const response = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('usuario', JSON.stringify(data.usuario));

                document.getElementById('successMessage').style.display = 'block';
                document.getElementById('successMessage').innerHTML = '✅ Login realizado! Redirecionando...';

                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1500);
            } else {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').innerHTML = '❌ ' + (data.error || 'Email ou senha inválidos');
            }
        } catch (error) {
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorMessage').innerHTML = '❌ Erro de conexão com o servidor';
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    });
</script>
</body>
</html>
